<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VSA EduAI — Painel dos Pais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#7c3aed">
<link rel="icon" type="image/png" href="/icon-192.png">
<style>
:root{
  --txt:#ece9f5; --dim:#9b95b5; --dim2:#6f6a86;
  --rox:#7c3aed; --rox2:#a78bfa;
  --verde:#22c55e; --amar:#f5b301; --verm:#ef4444; --azul:#3b82f6;
  --card-border:rgba(176,160,225,.10);
  --r:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}
body{
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;color:var(--txt);
  background:
    radial-gradient(900px 620px at 10% -12%, rgba(124,58,237,.42), transparent 58%),
    radial-gradient(720px 520px at 96% 112%, rgba(37,99,235,.16), transparent 60%),
    linear-gradient(165deg,#16121f 0%,#0c0a14 72%);
  background-attachment:fixed;min-height:100vh;-webkit-font-smoothing:antialiased;
}
.hidden{display:none!important}
.wrap{max-width:760px;margin:0 auto;width:100%;
  padding:calc(22px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right))
          calc(40px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left))}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.voltar{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);color:var(--txt);font-family:inherit;font-weight:700;
  font-size:14.5px;padding:9px 17px;border-radius:999px;cursor:pointer;text-decoration:none}
.voltar:hover{background:rgba(255,255,255,.1)}
.brand{display:flex;align-items:center;gap:10px;flex:1}
.brand .badge{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:17px;
  background:linear-gradient(140deg,#8b4ef2,var(--rox));box-shadow:0 4px 12px -4px rgba(124,58,237,.7)}
.brand h1{font-size:20px;font-weight:800;letter-spacing:-.2px}
.brand .sub{font-size:12.5px;color:var(--dim);font-weight:600}
.card{background:linear-gradient(180deg,#16141f,#121020);border:1px solid var(--card-border);
  border-radius:var(--r);box-shadow:0 18px 40px -24px rgba(0,0,0,.8);padding:22px 24px}
.sec{font-size:12.5px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;
  margin:30px 4px 14px;display:flex;align-items:center;gap:9px}
.sec .count{background:rgba(124,58,237,.22);color:var(--rox2);font-size:11.5px;font-weight:800;
  padding:2px 9px;border-radius:999px;letter-spacing:0}
.hero{display:flex;align-items:center;gap:20px;padding:24px}
.hero .avc{position:relative;width:74px;height:74px;flex-shrink:0;display:grid;place-items:center}
.hero .avc svg{position:absolute;inset:0;transform:rotate(-90deg)}
.hero .avc .face{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:32px;position:relative;
  background:radial-gradient(circle at 35% 30%,#2a2740,#16131f);box-shadow:inset 0 0 0 1px rgba(167,139,250,.25)}
.hero .avc .face .av-img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.hero .avc .face .av-img.con{object-fit:contain;padding:6%}
.hero .avc .lv{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#8b4ef2,var(--rox));
  color:#fff;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;border:2px solid #14121d;white-space:nowrap}
.hero .who{flex:1;min-width:0}
.hero .who .nm{font-size:22px;font-weight:800;letter-spacing:-.3px}
.hero .who .role{font-size:13px;color:var(--dim);font-weight:600;margin-top:1px}
.hero .who .xpline{font-size:12.5px;color:var(--dim);margin-top:11px;display:flex;justify-content:space-between}
.hero .who .xpline b{color:var(--rox2)}
.hero .who .xpbar{height:9px;background:#0c0a14;border-radius:999px;overflow:hidden;margin-top:6px;border:1px solid rgba(255,255,255,.06)}
.hero .who .xpbar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--rox),var(--rox2));box-shadow:0 0 10px rgba(167,139,250,.5)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.stat{background:linear-gradient(180deg,#16141f,#121020);border:1px solid var(--card-border);border-radius:16px;padding:15px 12px;text-align:center}
.stat .v{font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
.stat .k{font-size:11px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-top:3px}
.stat.fire .v,.stat.coin .v{color:var(--amar)} .stat.xp .v{color:var(--rox2)} .stat.med .v{color:var(--verde)}
.req{display:flex;align-items:center;gap:16px;padding:17px 20px;margin-bottom:13px}
.req .ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:26px;flex-shrink:0;
  background:rgba(245,179,1,.12);border:1px solid rgba(245,179,1,.25)}
.req .info{flex:1;min-width:0}
.req .info .t{font-size:16.5px;font-weight:800}
.req .info .s{font-size:13px;color:var(--dim);font-weight:600;margin-top:2px}
.req .aprovar{background:linear-gradient(180deg,#8b4ef2,var(--rox));color:#fff;font-family:inherit;font-weight:800;
  font-size:14.5px;padding:11px 20px;border:0;border-radius:13px;cursor:pointer;white-space:nowrap;
  box-shadow:0 5px 0 0 #5b21b6,0 12px 22px -8px rgba(124,58,237,.6)}
.req .aprovar:active{transform:translateY(3px);box-shadow:0 2px 0 0 #5b21b6}
.req .done{display:inline-flex;align-items:center;gap:6px;background:rgba(34,197,94,.13);color:#86efac;
  border:1px solid rgba(34,197,94,.4);font-weight:800;font-size:13.5px;padding:9px 16px;border-radius:13px;white-space:nowrap}
.mat{display:flex;align-items:center;gap:16px;padding:18px 20px;margin-bottom:13px}
.mat .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:24px;flex-shrink:0;
  background:color-mix(in srgb, var(--mc,#7c3aed) 16%, transparent);border:1px solid color-mix(in srgb, var(--mc,#7c3aed) 42%, transparent)}
.mat .body{flex:1;min-width:0}
.mat .row1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mat .nm{font-size:16.5px;font-weight:800}
.mat .stars{font-size:13px;color:var(--amar);white-space:nowrap;font-weight:700;letter-spacing:.5px}
.mat .pb{height:8px;background:#0c0a14;border-radius:999px;overflow:hidden;margin-top:10px;border:1px solid rgba(255,255,255,.05)}
.mat .pb>i{display:block;height:100%;border-radius:999px;background:var(--mc,#7c3aed)}
.mat .meta{font-size:12.5px;color:var(--dim);font-weight:600;margin-top:7px;display:flex;justify-content:space-between}
.mat .meta .ok{color:var(--verde);font-weight:800}
.medwrap{display:flex;flex-wrap:wrap;gap:14px}
.med{display:flex;flex-direction:column;align-items:center;width:84px;text-align:center}
.med .e{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:30px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.med.got .e{background:linear-gradient(160deg,rgba(245,179,1,.16),rgba(124,58,237,.13));border-color:rgba(245,179,1,.4)}
.med.lock .e{filter:grayscale(1) brightness(.5)}
.med .n{font-size:11px;font-weight:700;margin-top:7px;line-height:1.2}
.med.lock .n{color:var(--dim2)}
.pcq{display:flex;align-items:center;gap:12px;padding:11px 2px}
.pcq+.pcq{border-top:1px solid rgba(255,255,255,.05)}
.pcq .e{font-size:24px;width:36px;text-align:center;flex-shrink:0}
.pcb{flex:1;min-width:0}
.pct{font-size:14px;font-weight:700}
.pcpb{height:6px;background:#0c0a14;border-radius:999px;overflow:hidden;margin-top:6px;border:1px solid rgba(255,255,255,.05)}
.pcpb>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--rox),var(--rox2))}
.pcn{font-size:12.5px;font-weight:800;color:var(--dim);white-space:nowrap}
.leit{padding:16px 18px}
.leit .lt-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.leit .lt-ic{font-size:26px;flex-shrink:0}
.leit .lt-t{font-size:16px;font-weight:800}
.leit .lt-s{font-size:12.5px;color:var(--dim);font-weight:600;margin-top:2px}
.leit .lt-foto{display:block;border-radius:12px;overflow:hidden;border:1px solid var(--card-border)}
.leit .lt-foto img{display:block;width:100%;max-height:340px;object-fit:contain;background:#0c0a14}
.leit .lt-nofoto{color:var(--dim2);font-weight:700;padding:18px;text-align:center;background:#0c0a14;border-radius:12px}
.leit .lt-txt{font-size:14.5px;line-height:1.55;font-weight:600;color:var(--txt);background:#0c0a14;border:1px solid var(--card-border);border-radius:12px;padding:13px 15px;white-space:pre-wrap;word-break:break-word}
.leit .lt-rate{display:flex;align-items:center;gap:12px;margin-top:12px}
.leit .lt-lb{font-size:13.5px;font-weight:700;color:var(--dim)}
.leit .lt-stars{display:flex;gap:3px}
.lv-star{background:none;border:0;font-size:30px;line-height:1;color:#3a3550;cursor:pointer;padding:0 1px}
.lv-star.on{color:var(--amar)}
.lv-star:hover{color:#ffd54f}
.leit .lt-cm{display:flex;gap:8px;margin-top:12px}
.leit .lt-cm input{flex:1;background:#100e1a;border:1.5px solid rgba(255,255,255,.12);color:var(--txt);padding:10px 12px;border-radius:11px;font-size:14px;font-family:inherit}
.leit .lt-cm input:focus{outline:none;border-color:rgba(167,139,250,.6)}
.lt-save{background:rgba(124,58,237,.2);border:1px solid rgba(124,58,237,.5);color:var(--rox2);font-weight:800;padding:0 16px;border-radius:11px;font-size:13.5px;cursor:pointer}
.idea{display:flex;gap:12px;align-items:flex-start;padding:11px 4px}
.idea+.idea{border-top:1px solid rgba(255,255,255,.05)}
.idea .ie{font-size:20px;flex-shrink:0}
.idea .it{font-size:14.5px;font-weight:600;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.idea .id8{font-size:12px;color:var(--dim);font-weight:600;margin-top:3px}
.msg-presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.msg-chip{background:rgba(124,58,237,.16);border:1px solid rgba(124,58,237,.4);color:var(--rox2);font-weight:700;font-size:12.5px;padding:8px 12px;border-radius:999px;cursor:pointer;text-align:left;font-family:inherit}
.msg-chip:hover{background:rgba(124,58,237,.26)}
.msgbox textarea{width:100%;min-height:64px;resize:vertical;background:#100e1a;border:1.5px solid rgba(255,255,255,.12);color:var(--txt);border-radius:13px;padding:12px 14px;font-size:15px;font-family:inherit}
.msgbox textarea:focus{outline:none;border-color:rgba(167,139,250,.6)}
.msg-send{margin-top:10px;background:linear-gradient(180deg,#8b4ef2,var(--rox));color:#fff;font-weight:800;padding:12px;border-radius:13px;font-size:15px;border:0;cursor:pointer;width:100%}
.msg-ok{font-size:13px;font-weight:700;margin-top:8px;min-height:16px}
.msg-ok.err{color:#fca5a5}
.msg-hist{margin-top:14px;border-top:1px solid var(--card-border);padding-top:10px}
.msg-hi{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 0;font-size:13.5px;font-weight:600}
.msg-hi+.msg-hi{border-top:1px solid rgba(255,255,255,.05)}
.msg-hi b{color:var(--dim);white-space:nowrap;font-size:12px}
.msg-hi b.v{color:#86efac}
.acts{padding:8px 6px}
.act{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:14px}
.act+.act{border-top:1px solid rgba(255,255,255,.05)}
.act .ai{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;flex-shrink:0;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
.act .ab{flex:1;min-width:0}
.act .at{font-size:14.5px;font-weight:700}
.act .ad{font-size:12px;color:var(--dim);font-weight:600;margin-top:2px;display:flex;align-items:center;gap:8px}
.act .read{color:#86efac;font-weight:700}
.act .ar{text-align:right;white-space:nowrap}
.act .ar .sc{font-size:13px;color:var(--dim);font-weight:700}
.act .ar .st{font-size:13px;color:var(--amar);letter-spacing:1px}
.foot{text-align:center;color:var(--dim2);font-size:12.5px;margin-top:34px;font-weight:600}
.foot a{color:var(--rox2);font-weight:700;text-decoration:none}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1b1726;
  border:1px solid rgba(34,197,94,.45);color:#86efac;font-weight:800;font-size:14.5px;padding:13px 22px;border-radius:14px;
  box-shadow:0 18px 40px -16px rgba(0,0,0,.7);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* login */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px}
#login .lg{font-size:60px}
#login h1{font-size:30px;font-weight:800}
#login input{width:100%;max-width:300px;background:#100e1a;border:1.5px solid rgba(255,255,255,.14);color:var(--txt);padding:14px;border-radius:14px;font-size:17px;text-align:center;font-family:inherit}
#login button{max-width:300px;width:100%;background:linear-gradient(180deg,#8b4ef2,var(--rox));color:#fff;font-weight:800;padding:14px;border:0;border-radius:14px;font-size:16px;cursor:pointer}
#login .err{color:#fca5a5;font-size:14px;font-weight:600;min-height:18px}
@media(max-width:560px){
  .card{padding:18px 16px}
  .hero{flex-direction:column;text-align:center;align-items:center;padding:20px 16px}
  .hero .who .xpline{justify-content:center;gap:10px;flex-wrap:wrap}
  .stats{grid-template-columns:repeat(2,1fr)}
  .req{flex-wrap:wrap}.req .aprovar,.req .done{width:100%;text-align:center;justify-content:center}
  .sec{margin:24px 2px 12px}
  .brand h1{font-size:18px}
  .mat{padding:16px 14px;gap:12px}
  .act{padding:11px 8px;gap:10px}
}
@media(max-width:380px){
  .stats{grid-template-columns:repeat(2,1fr);gap:9px}
  .stat .v{font-size:19px}
  .medwrap{gap:10px;justify-content:center}
}
/* barra do pai (seletor de filho / admin / sair) */
.pai-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pai-who{font-size:15px;font-weight:800}
.pai-acts{display:flex;align-items:center;gap:8px}
.pai-sel,.pai-sel1{background:#16141f;border:1px solid var(--card-border);color:var(--txt);font-weight:700;font-size:13.5px;padding:8px 12px;border-radius:11px;font-family:inherit}
.pai-add,.pai-admin{width:36px;height:36px;border-radius:10px;border:1px solid var(--card-border);background:rgba(255,255,255,.05);color:var(--txt);font-size:16px;font-weight:800;cursor:pointer}
.pai-sair{background:none;border:0;color:var(--dim);font-weight:700;font-size:13px;cursor:pointer;text-decoration:underline}
.ob .ob-h{font-size:17px;font-weight:800;margin-bottom:6px}
.ob .ob-p{color:var(--dim);font-size:13.5px;font-weight:600;margin-bottom:12px}
.ob label{display:block;font-size:13px;font-weight:700;color:var(--dim);margin:10px 0 5px}
.ob input{width:100%;background:#100e1a;border:1.5px solid rgba(255,255,255,.12);color:var(--txt);padding:11px 13px;border-radius:11px;font-size:15px;font-family:inherit}
.ob input:focus{outline:none;border-color:rgba(167,139,250,.6)}
.ob .msg-send{margin-top:14px}
/* boas-vindas */
.bv-wrap{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:18px}
.bv-back{position:fixed;inset:0;background:rgba(8,6,14,.72);backdrop-filter:blur(3px)}
.bv-card{position:relative;z-index:81;max-width:520px;width:100%;max-height:88vh;overflow:auto;
  background:linear-gradient(180deg,#1b1530,#13101e);border:1px solid var(--card-border);border-radius:22px;
  padding:26px 22px;box-shadow:0 30px 70px -20px rgba(0,0,0,.85)}
.bv-emoji{font-size:48px;text-align:center}
.bv-h{font-size:24px;font-weight:800;text-align:center;margin:6px 0 14px}
.bv-tx p{font-size:14.5px;line-height:1.6;font-weight:500;color:#d8d3ea;margin-bottom:11px}
.bv-tx b{color:var(--txt)}
.bv-card .btn{margin-top:8px}
.oli-pais-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;font-size:14px;line-height:1.5}
</style>
</head>
<body>

<div id="login">
  <div class="lg">📊</div>
  <h1>Painel dos Pais</h1>
  <p style="color:var(--dim)">VSA EduAI</p>
  <input id="user-inp" type="text" placeholder="Seu usuário" autocomplete="username">
  <input id="senha-inp" type="password" placeholder="Sua senha" autocomplete="current-password">
  <button onclick="entrar()">Entrar</button>
  <div class="err" id="login-msg"></div>
</div>

<div class="wrap hidden" id="app">
  <div class="topbar">
    <a class="voltar" href="/">← hub do aluno</a>
    <div class="brand">
      <div class="badge">📊</div>
      <div><h1>Painel dos Pais</h1><div class="sub">VSA EduAI • acompanhe o explorador</div></div>
    </div>
  </div>
  <div id="view"></div>
  <div class="foot">VSA EduAI • <a href="/">hub do aluno</a></div>
</div>

<div class="toast" id="toast"></div>
<script src="/pais.js"></script>
</body>
</html>
